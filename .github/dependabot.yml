version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL init and analyze exchange versioned configuration and must move together.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
